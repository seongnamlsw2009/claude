name: OpenAI Image

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "이미지 생성 프롬프트"
        required: true

env:
  # GitHub Secrets에 저장한 키를 환경변수로 주입합니다.
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_IMAGE_MODEL: gpt-image-2.5-sunburst

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secret is available
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret이 설정되지 않았습니다." && exit 1
          fi
          echo "OPENAI_API_KEY 로드됨 (모델: $OPENAI_IMAGE_MODEL)"
      # 여기에 이미지 생성 스크립트 실행 단계를 추가하세요.
