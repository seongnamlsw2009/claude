name: OpenAI Image

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "이미지 생성 프롬프트"
        required: true
        default: "A beautiful anime-style girl, long flowing silver hair, bright blue eyes, gentle smile, school uniform, cherry blossom petals in the spring breeze, soft sunlight, highly detailed, vibrant colors"
      model:
        description: "이미지 모델 ID"
        required: true
        default: "gpt-image-2.6-sunburst"

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_IMAGE_MODEL: ${{ inputs.model }}
      PROMPT: ${{ inputs.prompt }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        run: test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret이 없습니다."; exit 1; }
      - name: Generate image
        run: python3 generate_image.py "$PROMPT" output/image.png
      - uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: output/image.png
